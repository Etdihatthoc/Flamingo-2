train_config:
  expdir: ./
  run_name: vstep-lora-3B
  delete_previous_checkpoint: true 
  batch_size: 1  # Increase since LoRA uses less memory
  gradient_accumulation_steps: 4  # Reduce since we increased batch_size
  seed: 42
  learning_rate: 0.0001  # Higher LR for LoRA training
  lr_scheduler: linear
  loss_multiplier: 1.0
  warmup_steps: 50
  weight_decay: 0.01  # Lower weight decay for LoRA
  precision: amp_bf16  # Use fp16 for stability
  gradient_checkpointing: False 
  num_epochs: 10  # Fewer epochs for LoRA
  offline: false
  freeze_lm_embeddings: false
  logging_steps: 5
  dist_backend: null
  dist_url: null
  no_set_device_rank: true
  fsdp: false
  horovod: false
  max_grad_norm: 1.0  # Add gradient clipping

# LoRA specific configuration
lora_config:
  r: 16  # LoRA rank
  lora_alpha: 32  # LoRA alpha (typically 2x rank)
  lora_dropout: 0.1  # LoRA dropout
  target_modules: ["q_proj", "v_proj", "k_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]  # Target modules for LoRA
  bias: "none"  # Bias handling
  task_type: "CAUSAL_LM"  # Task type

# instruction tuning hparams
sft_config:
  pretrained_path: null
  pretrained_ckpt: null
  unfreeze_full_lm: false  # Keep frozen for LoRA

data_config:
  dataset_blending_global_weight: 1.0

  dataset_blending_config:
    VSTEP-SpeakingScoring/train:
      weight: 1.0

  dataset_file_root: /home/user01/aiotlab/sondinh/Flamingo/audio-flamingo/audio_flamingo_2/data/manifests-balance
  data_root: /home/user01/aiotlab/sondinh/DATA_Vocal
  dataset_blending_output: /home/user01/aiotlab/sondinh/Flamingo/audio-flamingo/audio_flamingo_2/train/vstep-lora-3B/dataset_blending.json
  max_tokens: 2345
  num_workers: 8  # Reduce for stability

  valid_dataset_config: 
    VSTEP-SpeakingScoring/val: true

clap_config:
  method: nvclap-large
  audio_embed_dim: 2048
  checkpoint: /home/user01/aiotlab/sondinh/Flamingo/audio-flamingo/audio_flamingo_2/train/hf_model_3B/clap_ckpt/epoch_16.pt

  window_length: 30.0  # seconds
  window_overlap: 0.0  # seconds
  max_num_window: 6  # 2 minutes
  max_num_fewshot: 1  # number of fewshot samples (including the final one)
  finetune: false

whisper_config:  
  method: whisper-large-v3
  path: openai/whisper-large-v3
  audio_embed_dim: 1280
  sampling_rate: 16000

  window_length: 30.0  # seconds
  window_overlap: 0.0  # seconds
  max_num_window: 1  # 5 minutes
  max_num_fewshot: 1  # number of fewshot samples (including the final one)

model_config:
  cache_dir: /home/user01/.cache
  lang_encoder_path: Qwen/Qwen2.5-3B
  tokenizer_path: Qwen/Qwen2.5-3B
  cross_attn_every_n_layers: 3
  audio_transformer_kwargs: {
    n_head: 8,
    n_layers: 3,
    d_inner: 2048,
    max_num_media: 128,
    max_window_per_audio: 1,
    common_encoder_embed_dim: 1024
  }